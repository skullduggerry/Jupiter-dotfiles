# Checks every push and pull request to the dotfiles, and nothing of the
# other Jupiter repos: Jupiter-installer's own check.yml checks the
# installer, with these dotfiles' main, and Jupiter-testing's, where the
# tests and linters live, checks all three with its tools as pushed. Daily
# on main as well, as
# Arch's packages move between pushes. The repos are laid out by
# Jupiter-testing's scripts/ci-repos.sh: this one as pushed, the others from
# the same branch where they have it.
#
#   arch   in an Arch container, as the desktop: the dotfiles' formatting
#          and linters, then their suites (./check.sh lint, ./check.sh test
#          dotfiles). Privileged: the suites' stand-ins use unshare.
#   nixos  on the runner's Nix, Jupiter-testing's scripts/nixos-check.sh
#          dotfiles: the Hyprland config checked by NixOS's Hyprland and the
#          QML suites run in NixOS's Quickshell, as the installer's flake.lock
#          pins them, as these versions differ from Arch's.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # The branch the repos are laid out by (a pull request's own, not its merge).
  BRANCH: ${{ github.head_ref || github.ref_name }}

# bash -eo pipefail: a failing command fails its step, in a pipe too.
defaults:
  run:
    shell: bash

jobs:
  arch:
    name: Arch (lint, the dotfiles' suites)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install tools
        # What Jupiter-testing's lint.sh and test.sh ask for the dotfiles,
        # and what an installed desktop has that the suites use: neovim's
        # Lua for lua-language-server, the GNOME schemas, Kvantum's
        # KvMojave, cmp; rust builds wallust.
        run: |
          pacman -Syu --noconfirm --needed git sudo rust \
            ruff mypy python-types-python-dateutil \
            shellcheck shfmt stylua lua lua-language-server zsh actionlint \
            qt6-declarative hyprland quickshell uwsm \
            python-coverage python-dateutil python-gobject python-pyxdg \
            util-linux file xdg-user-dirs \
            neovim gsettings-desktop-schemas kvantum diffutils
          # To compare with the desktop when a check passes there only.
          pacman -Q quickshell qt6-declarative hyprland lua-language-server python
      - name: Add an unprivileged user
        # Root reads every file, which the permission checks rely on not
        # doing.
        run: |
          useradd -m ci
          # A session's runtime folder, which Hyprland's config check insists on.
          install -d -m 700 -o ci "/run/user/$(id -u ci)"
      - id: wallust
        uses: actions/cache/restore@v4
        with:
          path: /home/ci/.cargo
          key: cargo-wallust-3.5.1
      - name: Install wallust
        # Built by cargo, as on the desktop (apply.sh looks in ~/.cargo/bin).
        if: steps.wallust.outputs.cache-hit != 'true'
        run: |
          chown -R ci: /home/ci
          sudo -u ci -H cargo install --locked wallust --version 3.5.1
      # Saved straight away, so a failing check doesn't cost the next run the build.
      - if: steps.wallust.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/ci/.cargo
          key: cargo-wallust-3.5.1
      - uses: actions/checkout@v4
        with:
          path: checkout
      - name: Lay out the repos
        run: |
          chown -R ci: "$GITHUB_WORKSPACE"
          as_ci() { sudo -u ci -H env GIT_TERMINAL_PROMPT=0 "$@"; }
          url=https://github.com/skullduggerry/Jupiter-testing.git
          as_ci git clone --quiet --depth 1 --branch "$BRANCH" "$url" Jupiter-testing 2>/dev/null ||
            as_ci git clone --quiet --depth 1 "$url" Jupiter-testing
          as_ci bash Jupiter-testing/scripts/ci-repos.sh checkout "$BRANCH"
      - name: Lint
        run: |
          cd Jupiter-dotfiles
          sudo -u ci -H env PATH="/home/ci/.cargo/bin:$PATH" XDG_RUNTIME_DIR="/run/user/$(id -u ci)" \
            ./check.sh lint
      - name: Test
        # After a failed lint too, while the repo is there to test.
        if: success() || failure()
        run: |
          cd Jupiter-dotfiles
          sudo -u ci -H env PATH="/home/ci/.cargo/bin:$PATH" XDG_RUNTIME_DIR="/run/user/$(id -u ci)" \
            ./check.sh test dotfiles

  nixos:
    name: NixOS (its Hyprland and Quickshell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: checkout
      - uses: cachix/install-nix-action@v31
      - name: Lay out the repos
        run: |
          export GIT_TERMINAL_PROMPT=0
          url=https://github.com/skullduggerry/Jupiter-testing.git
          git clone --quiet --depth 1 --branch "$BRANCH" "$url" Jupiter-testing 2>/dev/null ||
            git clone --quiet --depth 1 "$url" Jupiter-testing
          bash Jupiter-testing/scripts/ci-repos.sh checkout "$BRANCH"
      - name: The dotfiles on NixOS's Hyprland and Quickshell
        # Jupiter-testing's scripts/nixos-check.sh says what it checks.
        run: bash Jupiter-testing/scripts/nixos-check.sh dotfiles
