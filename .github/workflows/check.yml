# Runs ./check.sh (Jupiter-testing's linters and suites) on every push and
# pull request, in an Arch container, so the checks don't have to run on a
# desktop. Privileged: the suites' stand-ins use unshare.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git sudo rust \
            ruff mypy shellcheck shfmt stylua lua lua-language-server zsh \
            qt6-declarative hyprland quickshell uwsm \
            python-coverage python-dateutil python-gobject python-pyxdg \
            util-linux file
      - name: Add an unprivileged user
        # Root reads every file, which the permission checks rely on not doing.
        run: useradd -m ci
      - uses: actions/cache@v4
        with:
          path: /home/ci/.cargo
          key: cargo-wallust-3.5.1
      - name: Install wallust
        # Built by cargo, as on the desktop (apply.sh looks in ~/.cargo/bin).
        run: |
          chown -R ci: /home/ci
          sudo -u ci -H cargo install --locked wallust --version 3.5.1
      - uses: actions/checkout@v4
        with:
          path: Jupiter-dotfiles
      - name: Check
        run: |
          chown -R ci: "$GITHUB_WORKSPACE"
          sudo -u ci -H env PATH="/home/ci/.cargo/bin:$PATH" \
            git clone --quiet https://github.com/skullduggerry/Jupiter-testing.git "$GITHUB_WORKSPACE/Jupiter-testing"
          cd Jupiter-dotfiles
          sudo -u ci -H env PATH="/home/ci/.cargo/bin:$PATH" ./check.sh
