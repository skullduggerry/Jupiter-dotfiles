# greetd, running the quickshell greeter under a minimal Hyprland.

# Which virtual terminal the greeter draws on. The session inherits it, so this
# is also the VT the desktop ends up on: ctrl+alt+F1 here.
#
# The conventional 1, as SDDM used. Arch's systemd enables a getty there, which
# greetd's Conflicts=getty@tty1.service keeps off; logind starts one on demand on
# the other VTs (NAutoVTs), so a text login is still ctrl+alt+F2 away.

[terminal]
vt = 1

[default_session]
# Plain Hyprland, not the start-hyprland wrapper: greetd already supervises
# the greeter process, so the wrapper's watchdog is redundant here, and it
# takes the real display instead of nesting, which makes the greeter
# untestable from inside a running session. The red warning it would
# otherwise print is turned off in hyprland.lua.
command = "Hyprland -c /etc/greetd/hyprland.lua"
user = "greeter"
