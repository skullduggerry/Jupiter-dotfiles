# Installed by scripts/install-system.sh as a drop-in of every user unit a
# login screen has no use for (the list is there). The greeter's Hyprland
# starts hyprland-session.target like any other, and Qt asks D-Bus for the
# portal, which brings PipeWire, the GTK portal and the accessibility bus
# with it: none of it is used before someone has logged in.
[Unit]
ConditionUser=!greeter
