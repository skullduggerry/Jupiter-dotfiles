# Read by /usr/bin/claude-desktop, one or more flags per line.
#
# Electron picks where it keeps secrets from XDG_CURRENT_DESKTOP, and it
# knows no "Hyprland", so it settles on basic_text: safeStorage reports no
# encryption, the app's sign-in tokens are never written, and every start
# asks for a sign-in again. gnome-keyring runs and the login keyring is
# unlocked at login (etc/pam.d/greetd), so point Electron at it.
--password-store=gnome-libsecret
