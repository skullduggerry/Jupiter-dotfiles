# Which portal backend answers what in a Hyprland session. This file replaces
# xdg-desktop-portal-hyprland's own (/usr/share/xdg-desktop-portal), whose
# default it repeats. Hyprland's backend has no RemoteDesktop, which KDE
# Connect's remote input (the phone as touchpad and keyboard) needs, so that
# goes to hypr-kdeconnect-fix (Jupiter-installer's aur.txt), which the
# Hyprland wiki points to. Without it installed, there is no RemoteDesktop,
# as before. After a change: systemctl --user restart xdg-desktop-portal,
# then KDE Connect (it keeps the old portal session).
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.RemoteDesktop=hypr-kdeconnect
