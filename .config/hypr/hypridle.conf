general {
    lock_cmd = qs ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    # Sleep waits until the screen is locked. The default (2) waits only when
    # the commands name hyprlock, and otherwise sleeps before the lock is up.
    inhibit_sleep = 3
}

# Seconds idle before the lock and before suspending, empty for never. The
# Settings app's Power page sets its own in a config that then sources this
# one (.config/quickshell/services/Idle.qml), which modules/startup.lua starts
# hypridle on once it exists. Without it, these:
# hyprlang if !idleFromShell
$lockAfter = 300
$suspendAfter =
# hyprlang endif

# hyprlang if lockAfter
listener {
    timeout = $lockAfter
    on-timeout = loginctl lock-session
}

# The screens go off half a minute after the lock.
listener {
    timeout = {{$lockAfter + 30}}
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
# hyprlang endif

# hyprlang if suspendAfter
listener {
    timeout = $suspendAfter
    on-timeout = systemctl suspend
}
# hyprlang endif
