# What hypridle (modules/startup.lua) does with an idle session: the shell
# locks it, then the screens go off. After /usr/share/hypr/hypridle.conf, the
# package's own example, with the shell as the lock screen. The shell's
# Caffeine tile holds both off: hypridle respects idle inhibitors.

general {
    lock_cmd = qs ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
