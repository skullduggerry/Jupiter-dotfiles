#%PAM-1.0
# The lock screen's fingerprint, run beside the password by
# services/LockService.qml (PamContext reads it from here). One try an
# attempt, so that every finger that did not match ends one and is counted
# there: three, and the lock leaves the password. With three tries here, two
# misses and a timeout ended an attempt as a timeout does, which the lock
# listens again after, as often as anyone liked.
auth    required    pam_fprintd.so    max-tries=1
