background_opacity 0.6
confirm_os_window_close 0
cursor_trail 1
enable_audio_bell no

include colors.conf

# The opacity follows the shell's glass (Settings → Appearance → Style →
# TINT) while themes apply to apps: new windows read the shell's record
# below, and open ones are sent it over their socket, which takes no other
# command without a password.
dynamic_background_opacity yes
allow_remote_control password
remote_control_password "" set-background-opacity
listen_on unix:${XDG_RUNTIME_DIR}/kitty
include ${XDG_STATE_HOME}/quickshell/tint.conf
