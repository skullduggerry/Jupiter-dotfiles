# The settings of the Python tools Jupiter-testing's checks run, which editors
# read too; the repo is no package.

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "I", "SIM", "RUF", "PLW1510"]
# ruff format wraps the code; a long string or comment stays as written.
ignore = ["E501"]
# keymap.py's dead keys, as the accents they type.
allowed-confusables = ["´", "¸", "˛"]

[tool.mypy]
# Unannotated helpers are checked too, without asking for annotations.
check_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
